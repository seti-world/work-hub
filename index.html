<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e8eaee">
<script>
/* 저장해 둔 화면 모드를 첫 그리기 전에 적용해, 켤 때 흰 화면이 번쩍이지 않게 합니다. */
try{
  var th = localStorage.getItem("workhub:theme");
  if(th === "dark" || th === "light") document.documentElement.dataset.theme = th;
}catch(e){}
</script>
<title>업무 관리 도구</title>
<style>
:root{
  --paper:#e8eaee;
  --surface:#ffffff;
  --ink:#17233a;
  --ink-soft:#5b6577;
  --rule:#ccd2dc;
  --rule-soft:#e2e6ec;
  --disk:#2f5d50;
  --mail:#8a5a2b;
  --msg:#3a4e8c;
  --etc:#6b6f78;
  --alert:#a8323b;
  --focus:#3a4e8c;
  --field:#fbfcfd;
  --hover:#f2f4f7;
  --primary-hover:#25344f;
  --aside:#f3f4f7;
  --aside-hover:#e9ebf0;
  --seen-bg:#f7f8fa;
  --code-bg:#f4f6f9;
  --sub-bg:#f5f7fa;
  --merge-bg:#eef1f6;
  --accent-soft:#f2f5fc;
  --on-ink:#ffffff;
  --veil:rgba(23,35,58,.42);
  --modal-shadow:0 12px 40px rgba(23,35,58,.28);
  --bar-shadow:0 6px 10px -8px rgba(23,35,58,.35);
  color-scheme:light;
}
/* 어두운 화면 — 시스템 설정을 따르거나(자동), 메뉴에서 직접 고를 수 있습니다 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181f; --surface:#1d232e; --ink:#dfe4ec; --ink-soft:#949dae;
    --rule:#39424f; --rule-soft:#2a3240;
    --disk:#66ab97; --mail:#c99a63; --msg:#93a7e4; --etc:#8b909a;
    --alert:#e57c84; --focus:#93a7e4;
    --field:#171c25; --hover:#252d3a; --primary-hover:#cbd4e2;
    --aside:#171c24; --aside-hover:#222a36; --seen-bg:#1a2029;
    --code-bg:#151a23; --sub-bg:#202734; --merge-bg:#222b3a; --accent-soft:#243048;
    --on-ink:#14181f; --veil:rgba(0,0,0,.55);
    --modal-shadow:0 12px 40px rgba(0,0,0,.6);
    --bar-shadow:0 6px 10px -8px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181f; --surface:#1d232e; --ink:#dfe4ec; --ink-soft:#949dae;
  --rule:#39424f; --rule-soft:#2a3240;
  --disk:#66ab97; --mail:#c99a63; --msg:#93a7e4; --etc:#8b909a;
  --alert:#e57c84; --focus:#93a7e4;
  --field:#171c25; --hover:#252d3a; --primary-hover:#cbd4e2;
  --aside:#171c24; --aside-hover:#222a36; --seen-bg:#1a2029;
  --code-bg:#151a23; --sub-bg:#202734; --merge-bg:#222b3a; --accent-soft:#243048;
  --on-ink:#14181f; --veil:rgba(0,0,0,.55);
  --modal-shadow:0 12px 40px rgba(0,0,0,.6);
  --bar-shadow:0 6px 10px -8px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
  font-size:14px;
  line-height:1.6;
}
button,input,select,textarea{font:inherit;color:inherit}
textarea{max-width:100%}
select{background:var(--field);color:var(--ink)}
select option{background:var(--surface);color:var(--ink)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── 상단 ── */
header{
  position:sticky;top:0;z-index:9;
  background:var(--surface);
  border-bottom:1px solid var(--rule);
  padding:14px 22px;
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;
}
h1{font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em;white-space:nowrap}
h1 span{font-weight:400;color:var(--ink-soft);margin-left:8px;font-size:13px}
.search{flex:1;min-width:180px;position:relative}
.search input{
  width:100%;padding:7px 11px;border:1px solid var(--rule);
  border-radius:3px;background:var(--field);
}
.toolbar{display:flex;gap:7px;flex-wrap:wrap}
.btn{
  border:1px solid var(--rule);background:var(--surface);
  padding:7px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.small{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--hover)}
.dirty{color:var(--alert);font-size:12px;white-space:nowrap}
.dirty.ok{color:var(--disk)}
.dirty.busy{color:var(--ink-soft)}

/* ── 메뉴 ── */
.menu-wrap{position:relative;display:inline-block}
.menu{
  position:absolute;right:0;top:calc(100% + 5px);z-index:30;
  background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  box-shadow:var(--modal-shadow);min-width:186px;padding:5px;
  display:flex;flex-direction:column;
}
.menu[hidden]{display:none}
.menu .btn{border:0;background:none;text-align:left;border-radius:3px;padding:9px 12px}
.menu .btn:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--rule-soft);margin:4px 2px}
.menu-ver{font-size:10.5px;color:var(--ink-soft);text-align:right;padding:4px 8px 2px}
.menu .btn.danger{color:var(--alert)}

/* ── 터치 화면(스마트폰·태블릿)에서는 누르기 쉽게 키웁니다 ── */
@media (pointer:coarse){
  .btn{padding:8px 12px;font-size:13.5px}
  .btn.small{padding:6px 9px;font-size:12.5px}
  .chip{padding:5px 11px;font-size:12.5px}
  .menu .btn{padding:11px 13px}
  input,select,textarea{font-size:16px}  /* 아이폰에서 입력 시 화면이 확대되는 것 방지 */
  .search input{font-size:16px}
  .entry .pick,.cand input[type=checkbox]{width:19px;height:19px}
}

/* ── 본체 ── */
main{display:grid;grid-template-columns:246px 1fr;min-height:calc(100vh - 59px)}
/* 그리드 칸이 내용 때문에 화면 폭을 넘어 늘어나지 않게 (모바일 가로 밀림의 근본 원인) */
aside,#panelWrap,section.panel{min-width:0}
#btnBack{display:none}
#btnBack2{display:none}   /* 모바일 내용 화면의 상단 고정줄에서만 보입니다 */
#fab{display:none}        /* 모바일 내용 화면에서만 보이는 ＋ 단추 */
aside{
  background:var(--aside);border-right:1px solid var(--rule);padding:14px 0;
  /* 주제·키워드가 많아도 사이드바 안에서만 스크롤되게 화면에 붙여 둡니다 */
  position:sticky;top:var(--headh,59px);align-self:start;
  max-height:calc(100vh - var(--headh,59px));overflow-y:auto;
}
.aside-head{padding:0 14px 10px;display:flex;justify-content:space-between;align-items:baseline}
.aside-head b{font-size:12px;color:var(--ink-soft);font-weight:600}
.topic{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-left:3px solid transparent;padding:9px 14px;cursor:pointer;
}
.topic:hover{background:var(--aside-hover)}
.topic.on{background:var(--surface);border-left-color:var(--ink)}
.topic .nm{font-weight:600;display:block;line-height:1.35}
.topic .meta{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.topic .meta .due{color:var(--alert);font-weight:600}

section.panel{padding:22px 26px;max-width:940px}
.panel-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:4px}
.panel-head h2{font-size:20px;margin:0;font-weight:700;letter-spacing:-.02em}
.panel-note{color:var(--ink-soft);margin:2px 0 18px;max-width:70ch}
.panel-note textarea{
  width:100%;border:1px solid var(--rule-soft);border-radius:3px;
  padding:7px 9px;resize:vertical;background:var(--field);
}

/* ── 필터 ── */
.stickybar{position:sticky;top:var(--headh,60px);z-index:7;background:var(--paper);
  padding-top:10px;margin-top:-10px;box-shadow:var(--bar-shadow)}
.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:2px 0 10px}
.stickybar .filters{margin-bottom:0;padding-bottom:9px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  padding-bottom:10px;border-bottom:1px solid var(--rule);margin-bottom:2px}
.chip{
  border:1px solid var(--rule);background:var(--surface);
  padding:3px 10px;border-radius:11px;cursor:pointer;font-size:12.5px;color:var(--ink-soft);
}
.chip.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.filters .sp{flex:1}

/* ── 시간축 ── */
.timeline{position:relative;padding:16px 0 0 0}
.timeline::before{content:"";position:absolute;left:73px;top:0;bottom:14px;width:1px;background:var(--rule)}
.entry{position:relative;display:grid;grid-template-columns:66px 1fr;gap:22px;padding:8px 0}
.entry .date{
  text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;
  color:var(--ink-soft);padding-top:2px;line-height:1.4;
}
.entry .date .tm{display:block;font-size:11.5px;opacity:.8}
.entry .dot{position:absolute;left:69px;top:12px;width:9px;height:9px;border-radius:50%;
  background:var(--etc);border:2px solid var(--paper)}
.entry.c-공유폴더 .dot{background:var(--disk)}
.entry.c-메일 .dot{background:var(--mail)}
.entry.c-메신저 .dot{background:var(--msg)}
.entry .body{
  background:var(--surface);border:1px solid var(--rule-soft);
  border-radius:3px;padding:10px 13px;
}
.entry.done .body{opacity:.55}
.entry.seen .body{opacity:.5;background:var(--seen-bg)}
.entry.seen .ttl{color:var(--ink-soft);font-weight:500}
.entry.seen:hover .body{opacity:.85}
.entry .ttl{font-weight:600;line-height:1.4}
.entry .ttl.body-only{white-space:pre-wrap;font-weight:500}
.entry.done .ttl{text-decoration:line-through}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px;font-size:11.5px}
.tag{color:var(--ink-soft)}
.tag.kind{font-weight:600;color:var(--ink)}
.tag.ch-공유폴더{color:var(--disk)}
.tag.ch-메일{color:var(--mail)}
.tag.ch-메신저{color:var(--msg)}
.tag.due{color:var(--alert);font-weight:600}
.tag.hash{color:var(--msg);cursor:pointer;border:0;background:none;padding:0;font-size:inherit}
.tag.hash:hover{text-decoration:underline}
.entry .detail{color:var(--ink-soft);white-space:pre-wrap;margin-top:3px}
.entry .path{
  font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--ink-soft);
  background:var(--code-bg);border-radius:2px;padding:2px 6px;margin-top:5px;display:inline-block;
  word-break:break-all;
}
.entry .acts{margin-top:6px;display:flex;gap:4px}

.empty{color:var(--ink-soft);padding:34px 0;max-width:56ch}
.empty b{display:block;color:var(--ink);margin-bottom:5px}

/* ── 모달 ── */
.veil{position:fixed;inset:0;background:var(--veil);display:flex;
  align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;z-index:9}
.modal{background:var(--surface);border-radius:4px;width:100%;max-width:620px;
  box-shadow:var(--modal-shadow)}
.modal h3{margin:0;padding:16px 20px;border-bottom:1px solid var(--rule);font-size:15px}
.modal .content{padding:18px 20px}
.modal .foot{padding:13px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:3px}
.field input,.field select,.field textarea{
  width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:3px;background:var(--field);
}
.field textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:11px}
.hint{font-size:12px;color:var(--ink-soft);margin:-6px 0 12px}

/* 붙여넣기 후보 */
.sub{border:1px solid var(--rule);border-radius:3px;background:var(--surface);
  margin:12px 0 0;overflow:hidden}
.sub-h{display:flex;align-items:center;gap:8px;padding:9px 11px;background:var(--sub-bg);
  border-bottom:1px solid transparent}
.sub.open .sub-h{border-bottom-color:var(--rule-soft)}
.sub-h b{font-size:13.5px}
.sub-h .cnt{font-size:11.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sub-h .sp{flex:1}
.sub-toggle{border:0;background:none;cursor:pointer;color:var(--ink-soft);
  padding:0 2px;font-size:12px;line-height:1}
.sub-body{padding:2px 11px 10px}
.sub-body .timeline::before{left:69px}
.tag.sub{color:var(--msg)}
.ord{display:inline-flex;gap:2px}
.loose-h{font-size:12px;color:var(--ink-soft);padding:16px 0 0}
.topic.all .nm{color:var(--ink)}
.topic.all{border-bottom:1px solid var(--rule-soft);margin-bottom:6px;padding-bottom:11px}
.group{margin-bottom:10px}
.group-h{display:flex;align-items:baseline;gap:9px;cursor:pointer;
  padding:14px 0 2px;border-bottom:1px solid var(--rule-soft)}
.group-h b{font-size:14.5px}
.group-h span{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.group-h:hover b{text-decoration:underline}
.mergebar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  background:var(--merge-bg);border:1px solid var(--rule);border-radius:3px;
  padding:8px 11px;margin:10px 0 2px;font-size:12.5px;color:var(--ink-soft)}
.mergebar .sp{flex:1}
.entry .pick{width:15px;height:15px;margin-right:2px}
.entry.picked .body{border-color:var(--msg);background:var(--accent-soft)}
.mgroup{margin-bottom:14px}
.mgroup-h{display:flex;align-items:baseline;gap:9px;padding:0 2px 6px}
.mgroup-h b{font-size:13.5px}
.mgroup-h span{font-size:11.5px;color:var(--ink-soft)}
.mrow{grid-template-columns:26px 68px 1fr 70px}
.mstat{font-size:11.5px;color:var(--disk);text-align:right}
.mstat.dup{color:var(--alert)}
.mstat.old{color:var(--ink-soft)}
.moving{background:var(--code-bg);border:1px solid var(--rule-soft);border-radius:3px;
  padding:9px 12px;margin-bottom:14px;line-height:1.5}
.moving .tag{font-size:11.5px}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:8px 2px 10px;font-size:12.5px;color:var(--ink-soft)}
.bulk-sp{flex:1}
.bulk select{padding:4px 6px;border:1px solid var(--rule);border-radius:3px;
  max-width:180px;font-size:12.5px}
.cands{border:1px solid var(--rule);border-radius:3px;max-height:330px;overflow:auto}
.cand{display:grid;grid-template-columns:26px 68px 1fr 78px 132px;gap:8px;align-items:center;
  padding:7px 9px;border-bottom:1px solid var(--rule-soft)}
.cand:last-child{border-bottom:0}
.cand input[type=checkbox]{width:15px;height:15px}
.cand .cd{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.cand .ct{line-height:1.35;font-size:13px;word-break:break-word;white-space:pre-wrap}
.cand select{padding:3px 5px;border:1px solid var(--rule);border-radius:3px;font-size:12px;min-width:0}
.cand select.guessed{border-color:var(--msg);background:var(--accent-soft)}

/* ── 사이드바: 묶음·읽지않음·키워드 ── */
.sec-row{display:flex;align-items:center;min-width:0}
.sec-row .sec-h{flex:1;width:auto;min-width:0}
.sec-x{border:0;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px;
  padding:10px 14px 2px 4px;line-height:1;flex-shrink:0}
.sec-x:hover{color:var(--ink)}
.sec-h{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;
  cursor:pointer;padding:12px 4px 4px 14px;font-size:12px;font-weight:700;color:var(--ink-soft);
  white-space:nowrap}
.sec-h .sec-nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-h .cnt{flex-shrink:0}
.menu-col{display:flex;flex-direction:column;gap:7px}
.menu-col .btn{text-align:left}
.sec-h .arr{font-size:10px}
.sec-h .cnt{font-weight:400}
.topic.in-sec{padding-left:26px}
.topic.unread .nm{font-weight:700}
.topic.unread .nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--msg);margin-right:6px;vertical-align:1px}
.tagcloud{display:flex;flex-wrap:wrap;gap:5px;padding:4px 14px 0}
.crumb{font-size:12px;color:var(--ink-soft)}

/* ── 날짜 구분선 ── */
.dayline{padding:14px 0 2px 88px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.dayline.pin-h{color:var(--mail)}

/* ── 표 보기 ── */
.tblwrap{overflow-x:auto;margin-top:12px}
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule-soft);font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--rule-soft);padding:7px 9px;text-align:left;vertical-align:top}
.tbl th{color:var(--ink-soft);font-size:12px;background:var(--sub-bg);white-space:nowrap}
.tbl tr.seen{opacity:.55}
.tbl .cd{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .where,.bcard .where{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

/* ── 할일 칸반 ── */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.bcol{background:var(--aside);border:1px solid var(--rule-soft);border-radius:4px;padding:8px;min-height:120px}
.bcol-h{font-size:12.5px;font-weight:600;color:var(--ink-soft);padding:2px 4px 8px}
.bcard{background:var(--surface);border:1px solid var(--rule-soft);border-radius:3px;padding:8px 10px;margin-bottom:7px}
.bacts{display:flex;gap:3px;margin-top:5px;align-items:center}
.bempty{color:var(--ink-soft);font-size:12px;padding:4px;margin:0}

/* ── 경과(댓글) ── */
.cmts{margin-top:6px;border-top:1px dashed var(--rule-soft);padding-top:5px}
.cmt{font-size:12.5px;color:var(--ink-soft);display:flex;gap:7px;align-items:baseline}
.cmt .cd{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.cmt-x{border:0;background:none;color:var(--ink-soft);cursor:pointer;padding:0 3px}
.cmt-x:hover{color:var(--alert)}
.chip.x{padding:3px 7px}

/* 검색결과 */
.hit{background:var(--surface);border:1px solid var(--rule-soft);border-radius:3px;
  padding:9px 12px;margin-bottom:7px;cursor:pointer}
.hit:hover{border-color:var(--rule)}
.hit .where{font-size:11.5px;color:var(--ink-soft)}
.hit .hit-acts{margin-top:4px}
.due-red{color:var(--alert)!important;font-weight:600}
.entry.hilite .body{outline:2px solid var(--msg);background:var(--accent-soft)}
.pr-opt{display:block;margin:4px 0;color:var(--ink);font-size:13.5px;cursor:pointer}
.pr-opt input{width:auto!important;margin-right:7px;vertical-align:-1px}

@media (max-width:760px){
  /* 상단 고정줄은 [← 목록][검색][메뉴] 한 줄만. 제목·붙여넣기·되돌리기는 고정 해제 */
  header{padding:8px 10px;gap:8px;flex-wrap:nowrap}
  h1{display:none}
  #btnPaste{display:none}
  #btnUndo{display:none}
  body[data-mnav="panel"] #btnBack2{display:inline-block;white-space:nowrap}
  .search{flex:1;min-width:0}
  .toolbar{gap:5px;margin-left:0}
  .toolbar .btn{padding:8px 11px;font-size:13px}

<script>
"use strict";

/* ─────────── 상태 ─────────── */
const KINDS = ["자료","논의","결정","할일"];
const CHANNELS = ["공유폴더","메일","메신저","기타"];
let state = { topics: [], activeId: null, savedViews: [], closedSections: [], tagBans: [] };
let filter = { kind: null, channel: null, openOnly: false, unseenOnly: false };
let dirty = false;
let searching = "";

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ── 해시태그 ──
   글 속에 "#보고서"처럼 쓰면 자동으로 키워드가 되고,
   기록 수정 창의 키워드 칸으로 직접 달 수도 있습니다. */
const TAG_RE = /#([0-9A-Za-z가-힣_]{1,20})/g;
function extractTags(){
  const s = new Set();
  for(const t of arguments)
    String(t || "").replace(TAG_RE, (m, w) => {
      // "#57 슬라이드"처럼 숫자뿐인 것은 번호 표기이지 키워드가 아닙니다.
      if(/[가-힣A-Za-z_]/.test(w)) s.add(w);
      return m;
    });
  return [...s];
}
function itemTags(i){
  // 자동 인식된 키워드 중 숨김 목록(오인식 처리)에 든 것은 뺍니다.
  // 직접 입력한 키워드(i.tags)는 숨김의 영향을 받지 않습니다.
  const bans = new Set(state.tagBans || []);
  return [...new Set([
    ...(i.tags || []),
    ...extractTags(i.title, i.detail).filter(w => !bans.has(w))
  ])];
}
/* 컴퓨터의 현지 시간 기준 오늘. (toISOString 은 세계표준시라 한국에서는
   오전 9시 이전에 하루 전 날짜가 나오므로 쓰지 않습니다.) */
const today = () => {
  const d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
};

/* Claude 안에서 열면 아티팩트 저장소를 쓰고, 일반 브라우저에서 열면 localStorage 에 자동 저장합니다.
   어느 쪽도 없으면 JSON 파일 내보내기 방식으로 동작합니다. */
const STORE_KEY = "workhub:v1";
const BACKUP_KEY = "workhub:v1:prev";
const hasCloud = typeof window.storage === "object" && window.storage !== null
                 && typeof window.storage.get === "function";
const hasLocal = (() => {
  try{ localStorage.setItem("workhub:t", "1"); localStorage.removeItem("workhub:t"); return true; }
  catch{ return false; }
})();
const canStore = hasCloud || hasLocal;
let storeOk = canStore;

async function backendGet(key){
  if(hasCloud){ const r = await window.storage.get(key); return r && r.value ? r.value : null; }
  return localStorage.getItem(key);
}
async function backendSet(key, val){
  if(hasCloud) await window.storage.set(key, val, false);
  else localStorage.setItem(key, val);
}
async function backendDel(key){
  if(hasCloud) await window.storage.delete(key, false);
  else localStorage.removeItem(key);
}

function status(text, cls){
  const el = $("#dirty");
  el.hidden = !text;
  el.textContent = text || "";
  el.className = "dirty" + (cls ? " " + cls : "");
}

let saveTimer = null;
let savePending = false;
function storeSave(){
  clearTimeout(saveTimer);
  savePending = true;
  status("저장 중", "busy");
  saveTimer = setTimeout(doSave, 700);
}
async function doSave(){
  clearTimeout(saveTimer);
  if(!savePending) return;
  savePending = false;
  let okLocal = false;
  if(canStore && storeOk){
    try{
      await backendSet(STORE_KEY, JSON.stringify(state));
      okLocal = true;
    }catch(err){ console.error(err); storeOk = false; }
  }
  const okFile = await fileWrite();
  if(okLocal || okFile){
    dirty = false;
    status(okFile ? "자동 저장됨 · 파일 동기화" : "자동 저장됨", "ok");
  }else{
    savePending = true;
    status("자동 저장 안 됨 — 파일로 내보내세요");
  }
}
/* 탭을 닫거나 화면을 벗어날 때, 아직 저장 안 된 변경을 그 자리에서 저장합니다. */
window.addEventListener("pagehide", () => { if(savePending && storeOk) doSave(); });
document.addEventListener("visibilitychange", () => {
  if(document.hidden && savePending && storeOk) doSave();
});

async function storeLoad(){
  const parse = raw => {
    try{ const d = JSON.parse(raw); return Array.isArray(d.topics) ? d : null; }
    catch{ return null; }
  };
  try{
    const raw = await backendGet(STORE_KEY);
    let d = raw ? parse(raw) : null;
    if(d){
      // 세션을 시작할 때의 상태를 한 벌 남겨, 잘못 저장돼도 되돌릴 여지를 둡니다.
      try{ await backendSet(BACKUP_KEY, raw); }catch(err){ console.error(err); }
      return d;
    }
    if(raw !== null){
      const b = await backendGet(BACKUP_KEY);
      d = b ? parse(b) : null;
      if(d){ flash("저장본이 손상되어 직전 백업을 불러왔습니다."); return d; }
    }
    return null;
  }catch{
    return null;
  }
}

function markDirty(){
  dirty = true;
  if(storeOk || fileHandle) storeSave();
  else status("저장 안 됨");
}

/* ─────────── 동기화 파일 (OneDrive 등) ───────────
   OneDrive·구글드라이브처럼 자동 동기화되는 폴더 안의 JSON 파일에 저장을 연결하면,
   같은 파일을 연결한 다른 컴퓨터와 내용이 오갑니다. 자료는 이 컴퓨터와
   본인 클라우드 계정 사이에서만 오가고, 다른 서버로는 나가지 않습니다. */
const canFS = !!(window.showSaveFilePicker && window.showOpenFilePicker && window.indexedDB);
let fileHandle = null;     // 연결된 파일
let pendingHandle = null;  // 권한을 다시 받아야 하는 파일
let fileMod = 0;           // 우리가 마지막으로 확인한 파일 수정 시각

function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open("workhub-fs", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v){
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction("kv", "readwrite");
    tx.objectStore("kv").put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k){
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const q = d.transaction("kv").objectStore("kv").get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
  });
}
async function idbDel(k){
  const d = await idbOpen();
  return new Promise((res, rej) => {
    const tx = d.transaction("kv", "readwrite");
    tx.objectStore("kv").delete(k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

function paintSync(){
  const b = $("#btnSync");
  if(!b) return;
  b.hidden = !canFS;
  if(!canFS) return;
  if(fileHandle){
    b.textContent = "동기화: " + fileHandle.name;
    b.title = "자동 저장이 이 파일과 연결되어 있습니다. 눌러서 바꾸거나 해제하세요.";
  }else if(pendingHandle){
    b.textContent = "동기화 다시 연결";
    b.title = "눌러서 연결해 둔 파일의 사용 권한을 다시 허용하세요.";
  }else{
    b.textContent = "동기화 파일";
    b.title = "OneDrive 등 동기화 폴더의 파일에 자동 저장을 연결합니다.";
  }
}

/* 파일 쪽에만 있는 기록을 지금 자료에 더합니다. 겹치는 기록은 건너뜁니다. */
function absorbState(inc){
  const plan = buildMergePlan(inc);
  const n = plan.reduce((a,p) => a + p.rows.filter(r => r.pick).length, 0);
  if(n) applyMerge(plan);
  return n;
}

/* 저장 직전에 파일이 다른 기기에서 먼저 바뀌었는지 확인하고,
   바뀌었으면 그쪽 기록을 받아들인 뒤에 씁니다. */
async function fileWrite(){
  if(!fileHandle) return false;
  try{
    const f = await fileHandle.getFile();
    if(fileMod && f.lastModified !== fileMod){
      try{
        const inc = normalizeState(await f.text());
        if(inc){
          const n = absorbState(inc);
          if(n) flash(`다른 기기의 기록 ${n}건을 받아들였습니다.`);
        }
      }catch(err){ console.error(err); }
    }
    const w = await fileHandle.createWritable();
    await w.write(JSON.stringify(state, null, 2));
    await w.close();
    fileMod = (await fileHandle.getFile()).lastModified;
    return true;
  }catch(err){
    console.error(err);
    pendingHandle = fileHandle; fileHandle = null;
    paintSync();
    flash("동기화 파일에 저장하지 못했습니다. 동기화 단추를 눌러 다시 연결하세요.");
    return false;
  }
}

/* 파일을 연결합니다. 파일에 내용이 있으면 먼저 읽어서 합칩니다. */
async function connectHandle(handle){
  fileHandle = handle; pendingHandle = null;
  try{
    const f = await handle.getFile();
    const raw = (await f.text()).trim();
    if(raw){
      const inc = normalizeState(raw);
      if(inc && inc.topics.length){
        const hasData = state.topics.some(t => t.items.length || t.note);
        if(!hasData){
          // 이쪽이 비어 있으면 파일 내용을 그대로 씁니다.
          state = inc;
          if(!state.topics.some(t => t.id === state.activeId))
            state.activeId = (state.topics[0] || {}).id || null;
          render();
        }else{
          const n = absorbState(inc);
          if(n) flash(`파일의 기록 ${n}건을 받아들였습니다.`);
        }
      }
    }
    fileMod = f.lastModified;
  }catch(err){ console.error(err); }
  paintSync();
  markDirty();   // 합쳐진 상태를 파일과 브라우저 저장소 양쪽에 기록
}

function openSyncModal(){
  const conn = !!fileHandle;
  const v = modal("동기화 파일",
    conn
      ? `<p class="hint">지금 <b>${esc(fileHandle.name)}</b> 파일에 자동 저장하고 있습니다.<br><br>
         이 파일이 OneDrive 같은 동기화 폴더 안에 있으면, 같은 파일을 연결한
         다른 컴퓨터와 내용이 오갑니다. 자료는 본인 클라우드 계정 밖으로 나가지 않습니다.</p>`
      : `<p class="hint">OneDrive·구글드라이브처럼 자동 동기화되는 폴더 안에 JSON 파일을 하나 두고
         연결하면, 변경할 때마다 그 파일에 저장되어 다른 컴퓨터와 내용이 오갑니다.<br><br>
         처음이면 <b>새 파일 만들기</b>로 동기화 폴더 안에 파일을 만들고,
         다른 컴퓨터에서 만들어 둔 파일이 있으면 <b>기존 파일 열기</b>로 이어서 쓰세요.</p>`,
    conn
      ? `<button class="btn" data-off>연결 해제</button>
         <button class="btn" data-open>다른 파일로 바꾸기</button>
         <button class="btn primary" data-x>닫기</button>`
      : `<button class="btn" data-x>취소</button>
         <button class="btn" data-open>기존 파일 열기</button>
         <button class="btn primary" data-new>새 파일 만들기</button>`);

  v.querySelector("[data-x]").onclick = () => v.remove();
  const fin = async h => {
    try{ await idbSet("handle", h); }catch(err){ console.error(err); }
    v.remove();
    await connectHandle(h);
    flash(`"${h.name}" 파일과 연결했습니다.`);
  };
  const on = (sel, fn) => { const b = v.querySelector(sel); if(b) b.onclick = fn; };
  on("[data-new]", async () => {
    try{
      const h = await window.showSaveFilePicker({
        suggestedName: "업무허브_동기화.json",
        types: [{ description: "업무 관리 자료", accept: { "application/json": [".json"] } }]
      });
      await fin(h);
    }catch(err){ if(err && err.name !== "AbortError") console.error(err); }
  });
  on("[data-open]", async () => {
    try{
      const picked = await window.showOpenFilePicker({
        types: [{ description: "업무 관리 자료", accept: { "application/json": [".json"] } }]
      });
      const h = picked[0];
      const p = await h.requestPermission({ mode: "readwrite" });
      if(p !== "granted"){ alert("쓰기 권한이 없어 연결하지 못했습니다."); return; }
      await fin(h);
    }catch(err){ if(err && err.name !== "AbortError") console.error(err); }
  });
  on("[data-off]", async () => {
    fileHandle = null; pendingHandle = null; fileMod = 0;
    try{ await idbDel("handle"); }catch(err){ console.error(err); }
    v.remove(); paintSync();
    flash("동기화 연결을 해제했습니다. 자동 저장은 이 브라우저 안에서만 계속됩니다.");
  });
}
const ALL = "__all";
let merging = false;
let flatView = false;   // 소주제를 풀고 전체를 시간순으로 볼지
let todoView = false;   // "모든 주제"에서 미결 할일만 기한순으로 볼지
let viewMode = "time";  // 주제 화면 보기: time(타임라인) | table(표) | board(칸반)
const picked = new Set();

/* ─────────── 되돌리기 ─────────── */
const undoStack = [];
function pushUndo(label){
  try{ undoStack.push({ label, snap: JSON.stringify(state) }); }
  catch(err){ console.error(err); return; }
  if(undoStack.length > 30) undoStack.shift();
  paintUndo();
}
function paintUndo(){
  const last = undoStack[undoStack.length - 1];
  ["#btnUndo", "#btnUndo2"].forEach(sel => {
    const b = $(sel);
    if(!b) return;
    b.disabled = !last;
    b.title = last ? `되돌리기: ${last.label}` : "되돌릴 것이 없습니다";
  });
}
function undo(){
  const u = undoStack.pop();
  if(!u) return;
  state = JSON.parse(u.snap);
  merging = false; picked.clear();
  if(!state.topics.some(t => t.id === state.activeId) && state.activeId !== ALL)
    state.activeId = (state.topics[0] || {}).id || null;
  markDirty(); render(); paintUndo();
  flash(`되돌렸습니다 — ${u.label}`);
}

function activeTopic(){ return state.topics.find(t => t.id === state.activeId) || null; }
function findOwner(itemId){
  for(const t of state.topics){
    const i = t.items.find(x => x.id === itemId);
    if(i) return { t, i };
  }
  return null;
}

/* ─────────── 렌더 ─────────── */
function overdue(t){
  const d = today();
  return t.items.filter(i => i.kind === "할일" && !i.done && i.due && i.due <= d).length;
}
function openTodos(t){ return t.items.filter(i => i.kind === "할일" && !i.done).length; }

function topicBtnHTML(t, inSec){
  const last = t.items.map(i => i.date).sort().pop();
  const od = overdue(t), ot = openTodos(t);
  const un = t.items.filter(i => !i.seen).length;
  let meta = last ? `최근 ${last}` : "기록 없음";
  if(un) meta += ` · 미확인 ${un}`;
  if(ot) meta += ` · 미결 ${ot}`;
  return `<button class="topic ${t.id===state.activeId?"on":""} ${un?"unread":""} ${inSec?"in-sec":""}" data-t="${t.id}">
    <span class="nm">${t.icon?esc(t.icon)+" ":""}${esc(t.name)}</span>
    <span class="meta">${esc(meta)}${od?` <span class="due">지연 ${od}</span>`:""}</span>
  </button>`;
}

function renderTopics(){
  const box = $("#topicList");
  const totalOpen = state.topics.reduce((n,t) => n + openTodos(t), 0);
  const totalUnseen = state.topics.reduce((n,t) => n + t.items.filter(i => !i.seen).length, 0);
  const all = `<button class="topic all ${state.activeId===ALL?"on":""}" data-t="${ALL}">
      <span class="nm">모든 주제</span>
      <span class="meta">${state.topics.length}개${totalUnseen?` · 미확인 ${totalUnseen}`:""}${totalOpen?` · 미결 ${totalOpen}`:""}</span>
    </button>`;
  if(!state.topics.length){
    box.innerHTML = '<p style="padding:0 14px;color:var(--ink-soft);font-size:13px">주제를 하나 만들고 시작하세요.</p>';
    $("#tagList").innerHTML = "";
    return;
  }

  // 상위 묶음별로 나눠 보여줍니다. 묶음 없는 주제가 먼저 나옵니다.
  const secs = [];
  const byName = new Map();
  state.topics.forEach(t => {
    const s = t.section || "";
    if(!byName.has(s)){ const o = { name: s, topics: [] }; byName.set(s, o); secs.push(o); }
    byName.get(s).topics.push(t);
  });
  secs.sort((a, b) => (a.name === "" ? -1 : b.name === "" ? 1 : 0));
  const closed = new Set(state.closedSections || []);

  box.innerHTML = all + secs.map(sec => {
    if(!sec.name) return sec.topics.map(t => topicBtnHTML(t, false)).join("");
    const un = sec.topics.reduce((n,t) => n + t.items.filter(i => !i.seen).length, 0);
    const head = `<div class="sec-row">
      <button class="sec-h" data-sec="${esc(sec.name)}">
        <span class="arr">${closed.has(sec.name)?"▸":"▾"}</span>
        <span class="sec-nm">${esc(sec.name)}</span>
        <span class="cnt">${sec.topics.length}${un?` · 미확인 ${un}`:""}</span></button>
      <button class="sec-x" data-smenu="${esc(sec.name)}" title="묶음 관리 — 순서·정렬·내보내기">⋯</button>
    </div>`;
    return head + (closed.has(sec.name) ? "" : sec.topics.map(t => topicBtnHTML(t, true)).join(""));
  }).join("");

  // 자주 쓰는 키워드(해시태그) 목록
  const cnt = new Map();
  state.topics.forEach(t => t.items.forEach(i =>
    itemTags(i).forEach(w => cnt.set(w, (cnt.get(w) || 0) + 1))));
  const top = [...cnt.entries()].sort((a,b) => b[1]-a[1]).slice(0, 15);
  const bans = state.tagBans || [];
  $("#tagList").innerHTML = (top.length || bans.length ? `
    <div class="aside-head" style="padding-top:16px"><b>키워드</b></div>
    <div class="tagcloud">${top.map(([w,n]) =>
      `<button class="chip" data-qtag="${esc(w)}">#${esc(w)} ${n}</button>` +
      `<button class="chip x" data-qtagdel="${esc(w)}" title="오인식된 키워드면 눌러서 숨기세요">×</button>`).join("")}</div>` : "") +
    (bans.length ? `
    <div class="aside-head" style="padding-top:12px"><b>숨긴 키워드</b></div>
    <div class="tagcloud">${bans.map(w =>
      `<button class="chip" data-qtagun="${esc(w)}" title="눌러서 복원">#${esc(w)} ↩</button>`).join("")}</div>` : "");
}

/* 메신저 대화처럼 제목이 본문 앞부분을 줄인 것뿐이면
   같은 내용이 두 번 보이지 않게 본문 전체를 한 번만 보여줍니다.
   제목이 "…"로 잘린 기록은 본문이 있으면 무조건 본문을 보여줘 잘림이 없게 합니다. */
function entryTextHTML(i){
  const title = String(i.title || "");
  const head = title.replace(/…\s*$/, "").trim();
  const clipped = /…\s*$/.test(title);
  if(i.detail && (clipped || (head && normText(i.detail).includes(normText(head)))))
    return `<div class="ttl body-only">${esc(i.detail)}</div>`;
  return `<div class="ttl">${esc(title)}</div>` +
         (i.detail ? `<div class="detail">${esc(i.detail)}</div>` : "");
}

function entryHTML(t, i){
  const tags = [`<span class="tag kind">${esc(i.kind)}</span>`,
                `<span class="tag ch-${esc(i.channel)}">${esc(i.channel)}</span>`];
  const g = i.groupId ? (t.groups||[]).find(x => x.id === i.groupId) : null;
  if(g) tags.push(`<span class="tag sub">${esc(g.name)}</span>`);
  if(i.owner) tags.push(`<span class="tag">${esc(i.owner)}</span>`);
  itemTags(i).forEach(w =>
    tags.push(`<button class="tag hash" data-tag="${esc(w)}" title="이 키워드로 검색">#${esc(w)}</button>`));
  if(i.kind === "할일" && i.due)
    tags.push(`<span class="tag ${(!i.done && i.due <= today())?"due":""}">기한 ${esc(i.due)}</span>`);
  return `<div class="entry c-${esc(i.channel)} ${i.done?"done":""} ${i.seen?"seen":""} ${picked.has(i.id)?"picked":""}" data-id="${i.id}">
    <div class="date">${esc(i.date||"")}${i.time?`<span class="tm">${esc(i.time)}</span>`:""}</div>
    <div class="dot"></div>
    <div class="body">
      <div class="tags">
        ${merging?`<input type="checkbox" class="pick" data-pick="${i.id}" ${picked.has(i.id)?"checked":""} aria-label="묶을 항목">`:""}
        ${tags.join("")}</div>
      ${entryTextHTML(i)}
      ${i.path?`<div class="path">${esc(i.path)}</div>`:""}
      ${(i.comments||[]).length?`<div class="cmts">${i.comments.map(c =>
        `<div class="cmt"><span class="cd">${esc(c.date)}</span><span>${esc(c.text)}</span>
         <button class="cmt-x" data-cdel="${i.id}|${c.id}" title="경과 지우기">×</button></div>`).join("")}</div>`:""}
      <div class="acts">
        <button class="btn small ghost" data-seen="${i.id}">${i.seen?"확인 해제":"확인"}</button>
        ${i.kind==="할일"?`<button class="btn small ghost" data-done="${i.id}">${i.done?"되돌리기":"완료 표시"}</button>`:""}
        <button class="btn small ghost" data-cmt="${i.id}">경과</button>
        <button class="btn small ghost" data-pin="${i.id}">${i.pinned?"고정 해제":"고정"}</button>
        ${state.topics.length>1?`<button class="btn small ghost" data-move="${i.id}">옮기기</button>`:""}
        <button class="btn small ghost" data-edit="${i.id}">수정</button>
        <button class="btn small ghost" data-del="${i.id}">삭제</button>
      </div>
    </div>
  </div>`;
}

function sortKey(i){ return (i.date||"") + "T" + (i.time||""); }

/* 날짜 구분선: "2026-02-12 (목)" */
function fmtDay(d){
  if(!d) return "날짜 없음";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? d : d + " (" + "일월화수목금토"[dt.getDay()] + ")";
}

/* 고정 기록을 맨 위에 모으고, 날짜가 바뀌는 곳마다 구분선을 넣습니다. */
function timelineHTML(t, items){
  const pins = items.filter(i => i.pinned);
  const rest = items.filter(i => !i.pinned);
  let html = "";
  if(pins.length)
    html += `<div class="dayline pin-h">📌 고정됨</div>` + pins.map(i => entryHTML(t, i)).join("");
  let last = null;
  rest.forEach(i => {
    if(i.date !== last){
      last = i.date;
      html += `<div class="dayline">${esc(fmtDay(i.date))}</div>`;
    }
    html += entryHTML(t, i);
  });
  return html;
}

function visibleItems(t){
  let items = t.items.slice();
  if(filter.kind) items = items.filter(i => i.kind === filter.kind);
  if(filter.channel) items = items.filter(i => i.channel === filter.channel);
  if(filter.openOnly) items = items.filter(i => i.kind === "할일" && !i.done);
  if(filter.unseenOnly) items = items.filter(i => !i.seen);
  items.sort((a,b) => sortKey(b).localeCompare(sortKey(a)) || (b.seq||0)-(a.seq||0));
  return items;
}

function actionRow(html){
  return `<div class="actions">${html}</div>`;
}

/* ── 표 보기: Notion 데이터베이스처럼 한눈에 훑는 용도 ── */
function tableHTML(t, items){
  if(!items.length) return `<p class="empty">조건에 맞는 기록이 없습니다.</p>`;
  return `<div class="tblwrap"><table class="tbl">
    <thead><tr><th>날짜</th><th>유형</th><th>내용</th><th>담당</th><th>기한·상태</th><th></th></tr></thead>
    <tbody>${items.map(i => {
      const st = i.kind === "할일" ? (i.done ? "완료" : (i.doing ? "진행" : "대기")) : "";
      return `<tr class="${i.seen?"seen":""}">
        <td class="cd">${esc(i.date||"")}${i.time?`<br>${esc(i.time)}`:""}</td>
        <td>${esc(i.kind)}</td>
        <td>${i.pinned?"📌 ":""}${esc(i.title)}${i.path?`<div class="where">${esc(i.path)}</div>`:""}</td>
        <td>${esc(i.owner||"")}</td>
        <td class="cd">${esc(i.due||"")}${st?`<br>${esc(st)}`:""}</td>
        <td><button class="btn small ghost" data-edit="${i.id}">수정</button></td>
      </tr>`;
    }).join("")}</tbody></table></div>`;
}

/* ── 할일 칸반: 대기 → 진행 → 완료. ◀▶ 로 옮깁니다 ── */
function boardHTML(t){
  const todos = t.items.filter(i => i.kind === "할일");
  const cols = [
    { k: "todo",  name: "대기", items: todos.filter(i => !i.done && !i.doing) },
    { k: "doing", name: "진행", items: todos.filter(i => !i.done && i.doing) },
    { k: "done",  name: "완료", items: todos.filter(i => i.done) }
  ];
  const d = today();
  if(!todos.length) return `<p class="empty"><b>할일이 없습니다.</b>기록 추가에서 유형을 "할일"로 저장하면 여기에 나타납니다.</p>`;
  return `<div class="board">${cols.map(c => `
    <div class="bcol">
      <div class="bcol-h">${c.name} <span>${c.items.length}</span></div>
      ${c.items.map(i => `<div class="bcard">
        <div>${esc(i.title)}</div>
        ${i.owner || i.due ? `<div class="where">${esc(i.owner||"")}${
          i.due ? ` · <span class="${!i.done && i.due <= d ? "due-red" : ""}">${esc(i.due)}까지</span>` : ""}</div>` : ""}
        <div class="bacts">
          ${c.k !== "todo" ? `<button class="btn small ghost" data-bmv="${i.id}|left" title="이전 단계로">◀</button>` : ""}
          ${c.k !== "done" ? `<button class="btn small ghost" data-bmv="${i.id}|right" title="다음 단계로">▶</button>` : ""}
          <span style="flex:1"></span>
          <button class="btn small ghost" data-edit="${i.id}">수정</button>
        </div>
      </div>`).join("") || `<p class="bempty">없음</p>`}
    </div>`).join("")}</div>`;
}

function sameFilter(f){
  return filter.kind === (f.kind || null) && filter.channel === (f.channel || null)
    && !!filter.openOnly === !!f.openOnly && !!filter.unseenOnly === !!f.unseenOnly;
}

function filterRow(extra){
  const chip = (on, key, val, label) =>
    `<button class="chip ${on?"on":""}" data-f="${key}" data-v="${val}">${label}</button>`;
  const isDefault = !filter.kind && !filter.channel && !filter.openOnly && !filter.unseenOnly;
  const saved = (state.savedViews || []).map(sv =>
    `<button class="chip ${sameFilter(sv.f)?"on":""}" data-sfil="${sv.id}">${esc(sv.name)}</button>` +
    `<button class="chip x" data-sfdel="${sv.id}" title="저장한 필터 지우기">×</button>`).join("");
  return `<div class="filters">
      ${chip(isDefault, "reset", "", "전체")}
      ${KINDS.map(k => chip(filter.kind===k, "kind", k, k)).join("")}
      <span style="color:var(--rule)">|</span>
      ${CHANNELS.map(c => chip(filter.channel===c, "channel", c, c)).join("")}
      ${chip(filter.openOnly, "open", "1", "미결만")}
      ${chip(filter.unseenOnly, "unseen", "1", "미확인만")}
      ${(state.savedViews||[]).length || !isDefault ? `<span style="color:var(--rule)">|</span>` : ""}
      ${saved}
      ${!isDefault ? `<button class="chip" data-sfsave title="지금 조합을 저장">+ 필터 저장</button>` : ""}
      <span class="sp"></span>${extra}
    </div>`;
}

function renderPanel(){
  const p = $("#panel");

  if(searching){
    const q = searching.toLowerCase();
    // "#키워드" 로 검색하면 해시태그가 달린 기록만 찾습니다. "#" 만 치면 태그 있는 것 전부.
    const tagQ = q.startsWith("#") ? q.slice(1).trim() : null;
    const hits = [];
    state.topics.forEach(t => t.items.forEach(i => {
      const tg = itemTags(i).map(x => x.toLowerCase());
      if(tagQ !== null){
        if(tg.length && (tagQ === "" || tg.some(x => x === tagQ || x.includes(tagQ))))
          hits.push({t, i});
      }else{
        const hay = [i.title, i.detail, i.path, i.owner].concat(tg).join(" ").toLowerCase();
        if(hay.includes(q) || t.name.toLowerCase().includes(q)) hits.push({t, i});
      }
    }));
    p.innerHTML = `<div class="panel-head"><h2>${tagQ !== null ? `#${esc(tagQ || "전체")} 태그 ` : "검색 "}결과 ${hits.length}건</h2></div>
      <p class="panel-note">항목을 누르면 해당 주제로 이동합니다.</p>` +
      (hits.length ? hits.map(({t,i}) => `<div class="hit" data-go="${t.id}" data-item="${i.id}">
        <div class="where">${esc(t.name)} · ${esc(i.date||"")} · ${esc(i.kind)} · ${esc(i.channel)}${
          itemTags(i).length ? ` · ${itemTags(i).map(w => "#" + esc(w)).join(" ")}` : ""}</div>
        <div>${esc(i.title)}</div>
        ${i.path?`<div class="where">${esc(i.path)}</div>`:""}
      </div>`).join("") : `<p class="empty">일치하는 기록이 없습니다.</p>`);
    return;
  }

  /* 모든 주제 — 유형·경로·미결 조건을 걸고 주제별로 나눠 봅니다 */
  if(state.activeId === ALL){
    const allInputs = `<div class="actions inputrow">
        <button class="btn" id="pasteHere">대화 붙여넣기</button>
        <button class="btn" id="txtHere">대화 파일 (.txt)</button>
        <button class="btn" id="emlHere">메일 파일 (.eml)</button>
      </div>`;
    const allCtl = `<button class="btn small ${todoView?"primary":""}" id="todoToggle">${todoView?"주제별로 보기":"할일 모아보기"}</button>`;

    /* 할일 모아보기 — 모든 주제의 미결 할일을 기한이 가까운 순서로 */
    if(todoView){
      const rows = [];
      state.topics.forEach(t => t.items.forEach(i => {
        if(i.kind === "할일" && !i.done) rows.push({t, i});
      }));
      rows.sort((a,b) => (a.i.due||"9999-99-99").localeCompare(b.i.due||"9999-99-99")
        || sortKey(a.i).localeCompare(sortKey(b.i)));
      const d = today();
      p.innerHTML = `
        <div class="panel-head"><h2>모든 주제 — 미결 할일</h2></div>
        <p class="panel-note">끝나지 않은 할일 ${rows.length}건을 기한이 가까운 순서로 모았습니다. 항목을 누르면 해당 주제로 이동합니다.</p>
        ${allInputs}
        <div class="stickybar">${actionRow(allCtl)}</div>
        ${rows.length ? rows.map(({t,i}) => `<div class="hit" data-go="${t.id}" data-item="${i.id}">
          <div class="where">${esc(t.name)}${i.owner?` · ${esc(i.owner)}`:""}</div>
          <div>${esc(i.title)}</div>
          <div class="where ${i.due && i.due <= d ? "due-red":""}">기한 ${esc(i.due||"없음")}${i.due && i.due <= d ? " — 지남":""}</div>
          <div class="hit-acts"><button class="btn small ghost" data-done="${i.id}">완료 표시</button></div>
        </div>`).join("") : `<p class="empty"><b>미결 할일이 없습니다.</b>모든 할일이 완료 상태입니다.</p>`}`;
      return;
    }

    const groups = state.topics.map(t => ({ t, items: visibleItems(t) })).filter(g => g.items.length);
    const total = groups.reduce((n,g) => n + g.items.length, 0);
    p.innerHTML = `
      <div class="panel-head"><h2>모든 주제</h2></div>
      <p class="panel-note">조건에 맞는 기록을 주제별로 모았습니다. 지금 ${total}건.</p>
      ${allInputs}
      <div class="stickybar">
      ${actionRow(allCtl)}
      ${filterRow("")}
      </div>
      ${groups.length ? groups.map(g => `
        <div class="group">
          <div class="group-h" data-go="${g.t.id}"><b>${esc(g.t.name)}</b><span>${g.items.length}건</span></div>
          <div class="timeline">${timelineHTML(g.t, g.items)}</div>
        </div>`).join("") : `<p class="empty">조건에 맞는 기록이 없습니다.</p>`}`;
    return;
  }

        ${t.section?`<div class="crumb">${esc(t.section)}</div>`:""}

      <div class="toolbar" style="margin-left:auto">
        <span class="ord">
          <button class="btn small" data-tmove="-1" ${sidx<=0?"disabled":""} title="위로">↑</button>

        <button class="btn small" id="renameTopic">이름 변경</button>
        <button class="btn small" id="delTopic">주제 삭제</button>
      </div>

    <div class="panel-note">
      <textarea id="topicNote" rows="2" placeholder="이 주제의 현재 상태를 한두 줄로">${esc(t.note||"")}</textarea>
    </div>
    <div class="actions inputrow">
      <button class="btn primary" id="addItem">+ 기록 추가</button>
      <button class="btn" id="pasteHere">대화 붙여넣기</button>

function fitHead(){
  const h = document.querySelector("header");
  if(h) document.documentElement.style.setProperty("--headh", h.offsetHeight + "px");
}
window.addEventListener("resize", fitHead);

function render(){ renderTopics(); renderPanel(); paintUndo(); fitHead(); }

/* 모바일에서는 목록 화면(list)과 내용 화면(panel)을 오갑니다.
   데스크톱에서는 CSS 가 적용되지 않아 아무 영향이 없습니다. */
function setMNav(v){
  document.body.dataset.mnav = v;
  fitHead();   // ← 목록 단추가 나타나고 사라지면 머리띠 높이가 달라집니다
  if(v === "list") window.scrollTo({ top: 0 });
}

/* 결과 패널이 화면에 바로 보이도록 위로 데려갑니다.
   (키워드·검색처럼 다른 곳을 누르고 결과는 패널에 뜨는 동작에서 씁니다) */
function showPanel(){
  setMNav("panel");
  const h = document.querySelector("header");
  const top = $("#panel").getBoundingClientRect().top + window.scrollY
              - ((h ? h.offsetHeight : 0) + 6);
  window.scrollTo({ top: Math.max(0, top) });
}

/* ─────────── 모달 ─────────── */
function modal(title, contentHTML, footHTML){
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>
    <div class="content">${contentHTML}</div><div class="foot">${footHTML}</div></div>`;

  // 배경 클릭·Escape 로 닫을 때, v.guard 가 참을 돌려주면 한 번 물어봅니다.
  const tryClose = () => {
    if(typeof v.guard === "function" && v.guard()
       && !confirm("작성 중인 내용이 사라집니다. 닫을까요?")) return;
    document.removeEventListener("keydown", onKey);
    v.remove();
  };
  const onKey = e => {
    if(!document.body.contains(v)){ document.removeEventListener("keydown", onKey); return; }
    const veils = document.querySelectorAll(".veil");
    if(veils[veils.length - 1] !== v) return;     // 위에 다른 창이 떠 있으면 그쪽이 받습니다
    if(e.key === "Escape"){ tryClose(); return; }
    if(e.key === "Tab"){                          // 초점이 창 밖으로 나가지 않게
      const els = [...v.querySelectorAll("button,input,select,textarea,a[href]")]
        .filter(x => !x.disabled && x.offsetParent !== null);
      if(!els.length) return;
      const first = els[0], last = els[els.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  };
  document.addEventListener("keydown", onKey);
  v.addEventListener("mousedown", e => { if(e.target === v) tryClose(); });
  document.body.appendChild(v);
  const f = v.querySelector("input,select,textarea"); if(f) f.focus();
  return v;
}
